    <script id="social-fix">
(function(){
  var map = {
    "twitter.com/Ma3aniZ": "https://x.com/ISMAILGROUPAI",
    "x.com/Ma3aniZ": "https://x.com/ISMAILGROUPAI",
    "tiktok.com/@digetalproducts": "https://www.tiktok.com/@izoking_shop",
    "instagram.com/digital_prodacte": "https://www.instagram.com/izo_king_studio",
    "pin.it/3OMTQWK2v": "https://www.linkedin.com/in/Izo-king-studio"
  };
  function fix(){
    document.querySelectorAll("a[href]").forEach(function(a){
      var h = a.getAttribute("href") || "";
      Object.keys(map).forEach(function(k){
        if (h.indexOf(k) !== -1) {
          a.setAttribute("href", map[k]);
          if (k.indexOf("pin.it") !== -1) {
            var t = a.textContent || "";
            if (/pinterest/i.test(t)) a.textContent = t.replace(/Pinterest/i, "LinkedIn");
          }
        }
      });
    });
  }
  fix();
  setInterval(fix, 1200);
  if (window.MutationObserver) {
    var obs = new MutationObserver(fix);
    obs.observe(document.documentElement, {childList:true, subtree:true});
  }
})();
    </script>
